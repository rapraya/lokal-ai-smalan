name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: JavaScript syntax and smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check Image Studio syntax
        run: node --check assets/js/image-studio.js
      - name: Check Audio Lab syntax
        run: node --check assets/js/audio-lab.js
      - name: Check browser smoke script syntax
        run: node --check scripts/browser-smoke.mjs
      - name: Check Cloudflare gateway syntax
        run: node --check gateway/src/worker.js
      - name: Run secure AI gateway tests
        run: node gateway/test/worker.test.mjs
      - name: Run gateway deployment readiness tests
        run: node gateway/test/deploy-readiness.test.mjs
      - name: Check WebLLM worker module syntax
        run: node --input-type=module --check < assets/js/webllm-worker.js
      - name: Check Knowledge embedding worker syntax
        run: node --check assets/js/knowledge-embedding-worker.js
      - name: Run Model Engine provider registry tests
        run: node scripts/model-engine-test.mjs
      - name: Run project smoke checks
        run: node scripts/smoke-check.mjs
      - name: Run deterministic CSV analysis tests
        run: node scripts/data-analysis-test.mjs
      - name: Run AI Assistant planning tests
        run: node scripts/assistant-test.mjs
      - name: Run Personal AI privacy and context tests
        run: node scripts/personal-ai-test.mjs
      - name: Run AI Knowledge retrieval tests
        run: node scripts/knowledge-test.mjs
