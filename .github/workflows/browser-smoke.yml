name: Browser smoke checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    name: Desktop and mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/lokal-ai-preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Static preview server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lokal-ai-preview.log
          exit 1

      - name: Run desktop and mobile browser smoke checks
        run: node scripts/browser-smoke.mjs
